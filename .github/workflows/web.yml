name: Web

# Builds the Avalonia WebAssembly site and uploads the static output to Vercel.
# Built here, not on Vercel: the bundle needs the wasm-tools workload (emscripten), which
# Vercel's build image doesn't have. main deploys to production; other branches get a preview.
on:
  push:
    branches: [main, feature/cloud-hosting]
    paths: ['src/**', 'tests/**', '.github/workflows/web.yml']
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Forks don't have the Vercel secrets; only this repository deploys.
    if: github.repository == 'BenDayan123/map-generator'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          # SDK 10 ships the wasm-tools-net8 workload that builds the net8.0-browser app;
          # 8.0.x pins the net8 targeting/runtime pack the app and tests target.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install WebAssembly build tools
        run: dotnet workload install wasm-tools-net8

      - name: Test
        run: dotnet test tests/GmapPlanner.Core.Tests

      - name: Publish browser app
        run: dotnet publish src/GmapPlanner.App.Browser -c Release -o publish/browser

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          # A GitHub secret can keep a trailing newline from a copy-paste; the Vercel CLI
          # rejects a --token (and mis-links an org/project id) that contains "\n". Strip CR/LF.
          TOKEN=$(printf '%s' "$VERCEL_TOKEN" | tr -d '\r\n')
          export VERCEL_ORG_ID=$(printf '%s' "$VERCEL_ORG_ID" | tr -d '\r\n')
          export VERCEL_PROJECT_ID=$(printf '%s' "$VERCEL_PROJECT_ID" | tr -d '\r\n')
          PROD_FLAG=""
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then PROD_FLAG="--prod"; fi
          # Pinned for reproducibility (a floating @latest can change flags/output under us).
          # Vercel enforces a server-side minimum CLI version, so bump this when a deploy
          # fails with "Your Vercel CLI version is outdated".
          URL=$(npx --yes vercel@59 deploy publish/browser/wwwroot $PROD_FLAG --yes --token "$TOKEN")
          echo "Deployed: $URL"
          echo "### Deployed to $URL" >> "$GITHUB_STEP_SUMMARY"
